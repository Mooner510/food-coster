name: Verify

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --no-frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
        env:
          TURSO_DATABASE_URL: https://example.invalid
          TURSO_AUTH_TOKEN: ci-placeholder
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          if-no-files-found: ignore
